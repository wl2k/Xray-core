name: Sync

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  UPSTREAM: XTLS/Xray-core

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: WaterLemons2k/scheduled-workflow-activity-action@v2

      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM}.git"

          git fetch --force upstream main:refs/remotes/upstream/main

          if git merge --no-edit upstream/main; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-files -u)" ]; then
            echo 'conflict=true' >> "$GITHUB_OUTPUT"

            # Mark conflicts as resolved without removing the markers, so the
            # half-merged tree becomes reviewable PR content.
            git add -A
            git commit -m 'chore: sync upstream XTLS/Xray-core (unresolved conflicts)'
          else
            echo '::error::git merge failed for a reason other than conflicts'
            exit 1
          fi

      - name: Push clean merge
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD:main

      - name: Open conflict PR
        if: steps.merge.outputs.conflict == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: sync/upstream
          delete-branch: true
          title: 'chore: sync upstream'
