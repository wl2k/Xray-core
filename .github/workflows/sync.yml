name: Sync

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  DEP_NAME: github.com/wl2k/reality
  UPSTREAM: XTLS/Xray-core

jobs:
  check-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Update dependency
        run: |
          go get ${{ env.DEP_NAME }}@latest
          go mod tidy
      - name: Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          DEP_VERSION=$(go list -m ${{ env.DEP_NAME }} | awk '{print $2}')
          git add -A
          git commit -m "chore(deps): bump ${{ env.DEP_NAME }} to $DEP_VERSION" || true
          git push
  sync:
    needs: check-reality
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: WaterLemons2k/scheduled-workflow-activity-action@v2

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM}.git"

          git fetch upstream main:refs/remotes/upstream/main

          BASE="$(git rev-parse HEAD)"
          MERGE_BASE="$(git merge-base HEAD upstream/main)"
          UPSTREAM_PATCH="$RUNNER_TEMP/upstream-without-workflows.patch"

          # Start a merge that keeps the current tree, then apply only the
          # non-workflow portion of upstream.  Excluding workflow paths before
          # applying changes prevents modify/delete conflicts such as a locally
          # deleted workflow that upstream has modified.
          git merge --no-commit --no-ff -s ours upstream/main

          # Upstream requires github.com/xtls/reality while this fork uses the
          # renamed github.com/wl2k/reality.  Swapping only the module path is
          # not enough: the upstream commit declares the old path in its own
          # go.mod, so Go rejects the requirement with "module declares its
          # path as ...".  Substituting the fork's own line does not help
          # either, because it sits in the same hunk as the neighbouring
          # dependency bumps and would still collide with the fork's pin.
          # Drop upstream's change to that requirement instead: rebuild the
          # upstream copy of go.mod with the merge-base line and diff that
          # tree, so the patch never touches reality and the fork's pin always
          # survives.
          BASE_MOD_LINE="$(git show "$MERGE_BASE":go.mod \
            | grep -E '^[[:space:]]*github\.com/(xtls|wl2k)/reality[[:space:]]' || true)"

          normalize_go_mod() {
            sed -E "s#^[[:space:]]*github\.com/(xtls|wl2k)/reality[[:space:]]+[^[:space:]]+.*\$#${BASE_MOD_LINE}#"
          }

          if [ -n "$BASE_MOD_LINE" ]; then
            # Build the normalized upstream tree in a throwaway index so the
            # real index keeps the merge state.
            GIT_INDEX_FILE="$RUNNER_TEMP/upstream.index"
            export GIT_INDEX_FILE
            git read-tree upstream/main

            # Compare the rewritten blob with the original instead of piping
            # into `grep -q`: grep exits early, git show then dies of SIGPIPE
            # and `set -o pipefail` turns the whole condition false.
            MOD_BLOB="$(git show upstream/main:go.mod | normalize_go_mod \
              | git hash-object -w --stdin)"
            if [ "$MOD_BLOB" != "$(git rev-parse upstream/main:go.mod)" ]; then
              git update-index --cacheinfo "100644,$MOD_BLOB,go.mod"
            fi

            UPSTREAM_TREE="$(git write-tree)"
            unset GIT_INDEX_FILE

            echo '::notice::Dropped upstream changes to the reality requirement'
          else
            UPSTREAM_TREE="$(git rev-parse 'upstream/main^{tree}')"
            echo '::warning::No reality requirement at the merge base; upstream go.mod left as is'
          fi

          # go.sum is a set, not a document: this fork still lists versions
          # that upstream has dropped, so "they delete, we keep" collides on
          # every dependency bump.  It is also not sorted in C order (Go sorts
          # by semver, so v0.2.0 precedes v0.10.0), which makes any re-sort
          # invent differences.  Keep go.sum out of the patch and union it
          # afterwards instead; extra entries are harmless, missing ones are
          # not.
          git diff --binary "$MERGE_BASE" "$UPSTREAM_TREE" -- \
            . ':(exclude).github/workflows/**' ':(exclude)go.sum' \
            > "$UPSTREAM_PATCH"

          # Upstream's hunks routinely carry the reality requirement as a
          # context line, while this fork pins a different module on that very
          # line, so `git apply --3way` reports a conflict on every dependency
          # bump next to it.  Make the fork's line look like the merge-base one
          # while the patch is applied, then put the pin back.
          FORK_MOD_LINE="$(grep -E '^[[:space:]]*github\.com/(xtls|wl2k)/reality[[:space:]]' go.mod || true)"
          RESTORE_MOD=false
          if [ -n "$FORK_MOD_LINE" ] && [ -n "$BASE_MOD_LINE" ] \
            && [ "$FORK_MOD_LINE" != "$BASE_MOD_LINE" ]; then
            awk -v from="$FORK_MOD_LINE" -v to="$BASE_MOD_LINE" \
              '$0 == from { print to; next } { print }' go.mod \
              > "$RUNNER_TEMP/go.mod.tmp"
            mv "$RUNNER_TEMP/go.mod.tmp" go.mod
            git add -- go.mod
            RESTORE_MOD=true
          fi

          # An empty patch means the fork already contains every upstream
          # commit; git apply would reject it, so only apply when needed.
          if [ -s "$UPSTREAM_PATCH" ] && ! git apply --index --3way "$UPSTREAM_PATCH"; then
            if [ -z "$(git ls-files -u)" ]; then
              echo '::error::Unable to apply upstream changes'
              exit 1
            fi
          fi

          if [ "$RESTORE_MOD" = true ]; then
            if [ -n "$(git ls-files -u -- go.mod)" ]; then
              # A real conflict: leave go.mod unmerged so the run opens the
              # conflict pull request instead of silently resolving it.
              echo '::warning::go.mod conflicted; the fork pin stays unresolved'
            else
              awk -v from="$BASE_MOD_LINE" -v to="$FORK_MOD_LINE" \
                '$0 == from { print to; next } { print }' go.mod \
                > "$RUNNER_TEMP/go.mod.tmp"
              mv "$RUNNER_TEMP/go.mod.tmp" go.mod
              git add -- go.mod
            fi
          fi

          git show upstream/main:go.sum \
            | { grep -vE '^github\.com/(xtls|wl2k)/reality ' || true; } \
            > "$RUNNER_TEMP/upstream.go.sum"

          # A real set union: keep every entry this fork already has and append
          # the upstream ones it is missing.  `git merge-file --union` cannot be
          # used here -- it keeps both sides of a *conflict* but silently
          # applies a clean deletion, so a dependency this fork still needs
          # would vanish from go.sum and the build would fail with "missing
          # go.sum entry".
          awk '!seen[$0]++' go.sum "$RUNNER_TEMP/upstream.go.sum" \
            > "$RUNNER_TEMP/go.sum.merged"
          mv "$RUNNER_TEMP/go.sum.merged" go.sum
          git add -- go.sum

          # Only remaining conflicts outside workflows determine the result.
          CONFLICTED="$RUNNER_TEMP/sync-conflicted-files.txt"
          git diff --name-only --diff-filter=U > "$CONFLICTED"

          if [ -s "$CONFLICTED" ]; then
            # Do not pre-merge.  A branch that already contains the merge has
            # nothing left to resolve, so GitHub would never offer its
            # in-browser conflict editor; keeping the two sides apart lets the
            # pull request resolve them in the web UI instead.
            git merge --abort
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
          elif ! git diff --cached --quiet; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
            git commit --no-edit
          else
            echo 'conflict=none' >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          fi

      - name: Push clean main
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD:main

      - name: Remove workflows from tag histories
        # Tags do not depend on the merge: run this even when the fork is
        # already up to date, otherwise a tag that a ruleset rejected is never
        # retried and stays missing forever.
        if: steps.merge.outputs.conflict != 'true'
        run: |
          python3 -m pip install --disable-pip-version-check git-filter-repo

          # Only new tags are rewritten. Re-pointing a tag that is already
          # published would rewrite published history and start a build for
          # every release that exists.
          git ls-remote --tags --refs origin \
            | cut -f2 | sed 's|^refs/tags/||' | LC_ALL=C sort \
            > "$RUNNER_TEMP/published-tags.txt"

          # Take the tag list from upstream instead of from the local clone.
          # The clone only auto-follows a tag when the commit it points at
          # happens to be fetched, so a tag sitting on a commit this fork
          # already has would be missed and never pushed.
          git ls-remote --tags --refs upstream \
            | cut -f2 | sed 's|^refs/tags/||' | LC_ALL=C sort \
            | comm -23 - "$RUNNER_TEMP/published-tags.txt" \
            > "$RUNNER_TEMP/new-tags.txt"

          if [ ! -s "$RUNNER_TEMP/new-tags.txt" ]; then
            echo '::notice::No new upstream tags'
            exit 0
          fi

          echo 'New tags:'
          sed 's/^/  /' "$RUNNER_TEMP/new-tags.txt"

          # Fetch exactly the tags that are missing locally.
          git fetch upstream \
            $(sed -E 's|(.+)|+refs/tags/\1:refs/tags/\1|' "$RUNNER_TEMP/new-tags.txt")

          # `--refs refs/tags/*` matches nothing: git does not expand globs in
          # revision arguments, so the refs have to be listed explicitly.
          git filter-repo --force \
            --refs $(sed 's|^|refs/tags/|' "$RUNNER_TEMP/new-tags.txt") \
            --path .github/workflows/ \
            --invert-paths

          while read -r tag; do
            if [ -n "$(git ls-tree -r --name-only "refs/tags/$tag" -- .github/workflows)" ]; then
              echo "::error::Workflow files remain in $tag"
              exit 1
            fi
          done < "$RUNNER_TEMP/new-tags.txt"

      - name: Push sanitized tags
        if: steps.merge.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh infers the repository from the git remotes, and with an upstream
          # remote present it picks XTLS/Xray-core, which this token cannot
          # dispatch to (HTTP 403: Resource not accessible by integration).
          # Pin it to the repository the workflow actually runs in.
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s "$RUNNER_TEMP/new-tags.txt" ]; then
            echo '::notice::Nothing to push'
            exit 0
          fi

          PUSHED="$RUNNER_TEMP/pushed-tags.txt"
          : > "$PUSHED"

          # Push tag by tag so a rejected tag reports its own name.
          while read -r tag; do
            if out="$(git push origin "refs/tags/$tag:refs/tags/$tag" 2>&1)"; then
              echo "$out"
              echo "$tag" >> "$PUSHED"
              continue
            fi

            echo "$out"

            # GH013 is a repository ruleset rejecting the ref (tag creation is
            # restricted for this actor).  That is a repository policy, not a
            # sync failure, so the run stays green.
            if printf '%s\n' "$out" | grep -q 'GH013'; then
              echo "::warning::Tag $tag was rejected by a repository ruleset (GH013); skipping it"
              continue
            fi

            echo "::error::Failed to push tag $tag"
            exit 1
          done < "$RUNNER_TEMP/new-tags.txt"

          # These tags carry no .github/workflows (the step above strips them)
          # and GitHub only reads workflow files from the pushed ref, so the
          # push itself can never start release.yml.  A push made with
          # GITHUB_TOKEN would not start another workflow either.  Dispatch it
          # explicitly from main and pass the tag along.
          if [ ! -s "$PUSHED" ]; then
            exit 0
          fi

          while read -r tag; do
            echo "Dispatching release.yml for $tag"
            # One attempt only, and a failure skips that tag: the release can
            # be dispatched by hand afterwards, and a dispatch problem is not a
            # reason to fail a run that already pushed main and the tags.
            if ! gh workflow run release.yml -f tag="$tag"; then
              echo "::warning::Unable to dispatch release.yml for $tag; skipping it"
            fi
          done < "$PUSHED"

      - name: Prepare conflict PR
        id: prepare-pr
        if: steps.merge.outputs.conflict == 'true'
        run: |
          git fetch origin main
          BASE="$(git rev-parse origin/main)"

          # Base the pull request on upstream instead of pre-merging it.  GitHub
          # only offers its in-browser conflict editor for a branch that still
          # has to be merged into the base, so the upstream commits are pushed
          # untouched and every conflict is resolved on the pull request page.
          git checkout -B sync/upstream upstream/main

          # Take the fork's own workflows back from main.  They must never come
          # from upstream, and with the same content on both sides they cannot
          # turn into a conflict inside the pull request.
          if git cat-file -e "$BASE:.github/workflows" 2>/dev/null; then
            git rm -r -q --ignore-unmatch .github/workflows
            git checkout "$BASE" -- .github/workflows
            if ! git diff --cached --quiet; then
              git commit -q -m 'chore(ci): keep the workflows of this fork'
            fi
          fi

          # Safety net: the branch must not carry upstream workflow files.
          if [ -n "$(git diff --name-only "$BASE" HEAD -- .github/workflows/)" ]; then
            echo '::error::Workflow changes remain in the pull request branch'
            exit 1
          fi

          git log --reverse --format='- %h %s' "$BASE..HEAD" \
            > "$RUNNER_TEMP/sync-commit-list.txt"

          {
            echo "## Included $(wc -l < "$RUNNER_TEMP/sync-commit-list.txt") commits"
            echo
            cat "$RUNNER_TEMP/sync-commit-list.txt"

            echo
            echo '## Conflicts'
            echo
            echo 'Expected to conflict:'
            echo
            awk '{ print "- `" $0 "`" }' "$RUNNER_TEMP/sync-conflicted-files.txt"
            echo
            echo 'Resolve them with the **Resolve conflicts** button on this pull'
            echo 'request and commit the merge from the browser; nothing has to be'
            echo 'fixed locally.'

            echo
            echo '## Notes'
            echo
            echo 'Workflow files are excluded from the sync changes.'
          } > "$RUNNER_TEMP/sync-pr-body.md"

          echo 'create_pr=true' >> "$GITHUB_OUTPUT"

      - name: Open conflict PR
        if: steps.prepare-pr.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # The step above leaves HEAD on sync/upstream, so the base branch
          # cannot be inferred from the checked out branch.
          base: main
          branch: sync/upstream
          delete-branch: true
          title: 'chore: sync upstream XTLS/Xray-core (conflict resolution)'
          body-path: ${{ runner.temp }}/sync-pr-body.md
