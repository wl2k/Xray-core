name: Sync

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  UPSTREAM: XTLS/Xray-core

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: WaterLemons2k/scheduled-workflow-activity-action@v2

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM}.git"

          git fetch upstream main:refs/remotes/upstream/main

          if git merge --no-commit --no-ff upstream/main; then
            :
          elif [ -z "$(git ls-files -u)" ]; then
            echo '::error::git merge failed for a reason other than conflicts'
            exit 1
          fi

          # Restore this fork's own workflows.
          git checkout HEAD -- .github/workflows/ 2>/dev/null || true
          git clean -fdq -- .github/workflows/

          if [ -n "$(git ls-files -u)" ]; then
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
            git add -A
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
            git commit --no-edit
          else
            echo 'conflict=none' >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          fi

      - name: Push clean main
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD:main

      - name: Fetch upstream tags
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git fetch --force upstream \
            '+refs/tags/*:refs/tags/*'

      - name: Remove workflows from tag histories
        if: steps.merge.outputs.conflict == 'false'
        run: |
          python3 -m pip install --disable-pip-version-check git-filter-repo

          # Rewrite tag histories only. Do not rewrite main.
          git filter-repo --force \
            --refs refs/tags/* \
            --path .github/workflows/ \
            --invert-paths

      - name: Push sanitized tags
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin 'refs/tags/*:refs/tags/*'

      - name: Prepare conflict PR
        if: steps.merge.outputs.conflict == 'true'
        run: |
          # Preserve the completed merge result before resetting main.
          MERGE_RESULT="$(git rev-parse HEAD)"

          git fetch origin main
          BASE="$(git rev-parse origin/main)"

          # Build a patch containing all changes except workflows.
          git diff --binary "$BASE" "$MERGE_RESULT" \
            -- . ':(exclude).github/workflows/**' \
            > "$RUNNER_TEMP/sync.patch"

          # Rebuild main from the remote base, removing upstream history
          # from the commits that will be pushed by create-pull-request.
          git checkout main
          git reset --hard "$BASE"

          # Apply only the filtered changes.
          if [ -s "$RUNNER_TEMP/sync.patch" ]; then
            git apply --index "$RUNNER_TEMP/sync.patch"
          fi

          # Verify that no workflow paths are staged or modified.
          if ! git diff --cached --quiet -- .github/workflows/; then
            echo "::error::Workflow changes remain in the PR"
            exit 1
          fi

          if ! git diff --quiet -- .github/workflows/; then
            echo "::error::Unstaged workflow changes remain"
            exit 1
          fi

          # Create a single commit based directly on origin/main.
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore: sync upstream XTLS/Xray-core (conflict resolution)"
          else
            echo "::notice::No non-workflow changes to include in PR"
          fi

          # Verify the resulting commit ancestry and changed paths.
          if [ "$(git rev-parse HEAD^)" != "$BASE" ]; then
            echo "::error::PR commit is not based directly on origin/main"
            exit 1
          fi

          if git diff-tree --no-commit-id --name-only -r HEAD \
            | grep -q '^\.github/workflows/'; then
            echo "::error::PR commit modifies workflow files"
            exit 1
          fi

          echo "Prepared clean PR commit: $(git rev-parse HEAD)"

      - name: Open conflict PR
        if: steps.merge.outputs.conflict == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: sync/upstream
          delete-branch: true
          title: 'chore: sync upstream XTLS/Xray-core (merge conflicts)'
