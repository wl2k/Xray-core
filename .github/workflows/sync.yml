name: Sync

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  UPSTREAM: XTLS/Xray-core

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: WaterLemons2k/scheduled-workflow-activity-action@v2

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM}.git"

          git fetch upstream main:refs/remotes/upstream/main

          BASE="$(git rev-parse HEAD)"
          MERGE_BASE="$(git merge-base HEAD upstream/main)"
          UPSTREAM_PATCH="$RUNNER_TEMP/upstream-without-workflows.patch"

          # Start a merge that keeps the current tree, then apply only the
          # non-workflow portion of upstream.  Excluding workflow paths before
          # applying changes prevents modify/delete conflicts such as a locally
          # deleted workflow that upstream has modified.
          git merge --no-commit --no-ff -s ours upstream/main

          git diff --binary "$MERGE_BASE" upstream/main -- \
            . ':(exclude).github/workflows/**' > "$UPSTREAM_PATCH"

          # An empty patch means the fork already contains every upstream
          # commit; git apply would reject it, so only apply when needed.
          if [ -s "$UPSTREAM_PATCH" ] && ! git apply --index --3way "$UPSTREAM_PATCH"; then
            if [ -z "$(git ls-files -u)" ]; then
              echo '::error::Unable to apply upstream changes'
              exit 1
            fi
          fi

          # Only remaining conflicts outside workflows determine the result.
          CONFLICTED="$RUNNER_TEMP/sync-conflicted-files.txt"
          git diff --name-only --diff-filter=U > "$CONFLICTED"

          if [ -s "$CONFLICTED" ]; then
            # git refuses to commit while the index still holds unmerged
            # entries, so mark the conflicted files as resolved without
            # touching the working tree.  The conflict markers are kept on
            # purpose: the pull request is opened for manual resolution and
            # must show exactly which hunks still need attention.
            git diff --name-only -z --diff-filter=U | xargs -0 -r git add --
            git commit --no-edit
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
          elif ! git diff --cached --quiet; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
            git commit --no-edit
          else
            echo 'conflict=none' >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          fi

      - name: Push clean main
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD:main

      - name: Fetch upstream tags
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git fetch --force upstream \
            '+refs/tags/*:refs/tags/*'

      - name: Remove workflows from tag histories
        if: steps.merge.outputs.conflict == 'false'
        run: |
          python3 -m pip install --disable-pip-version-check git-filter-repo

          # Rewrite tag histories only. Do not rewrite main.
          git filter-repo --force \
            --refs refs/tags/* \
            --path .github/workflows/ \
            --invert-paths

      - name: Push sanitized tags
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin 'refs/tags/*:refs/tags/*'

      - name: Prepare conflict PR
        id: prepare-pr
        if: steps.merge.outputs.conflict == 'true'
        run: |
          git fetch origin main
          BASE="$(git rev-parse origin/main)"
          MERGE_RESULT="$(git rev-parse HEAD)"

          # Push the merge commit and every upstream commit it brings in as-is:
          # the pull request must mirror the real upstream history instead of a
          # squashed copy of it.
          git log --reverse --format='- %h %s' \
            "$BASE..$MERGE_RESULT" \
            > "$RUNNER_TEMP/sync-commit-list.txt"

          {
            echo "## Included $(wc -l < "$RUNNER_TEMP/sync-commit-list.txt") commits"
            echo
            cat "$RUNNER_TEMP/sync-commit-list.txt"

            echo
            echo '## Conflicts'
            echo
            if [ -s "$RUNNER_TEMP/sync-conflicted-files.txt" ]; then
              echo 'The merge left unresolved conflicts in the following files. They'
              echo 'are committed as-is, with conflict markers where applicable, so the'
              echo 'pull request shows every hunk that still needs to be resolved.'
              echo
              awk '{ print "- `" $0 "`" }' "$RUNNER_TEMP/sync-conflicted-files.txt"
            else
              echo 'None.'
            fi

            echo
            echo '## Notes'
            echo
            echo 'Workflow files are excluded from the sync changes.'
          } > "$RUNNER_TEMP/sync-pr-body.md"

          # Safety net: the merged tree must not carry upstream workflow files.
          # Comparing trees also covers merge commits, which diff-tree ignores.
          if [ -n "$(git diff --name-only "$BASE" "$MERGE_RESULT" -- .github/workflows/)" ]; then
            echo '::error::Workflow changes remain in the merge result'
            exit 1
          fi

          echo 'create_pr=true' >> "$GITHUB_OUTPUT"

      - name: Open conflict PR
        if: steps.prepare-pr.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: sync/upstream
          delete-branch: true
          title: 'chore: sync upstream XTLS/Xray-core (conflict resolution)'
          body-path: ${{ runner.temp }}/sync-pr-body.md
