name: Sync

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  UPSTREAM: XTLS/Xray-core

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: WaterLemons2k/scheduled-workflow-activity-action@v2

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Merge upstream
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM}.git"

          git fetch upstream main:refs/remotes/upstream/main

          BASE="$(git rev-parse HEAD)"

          # Attempt the merge. Conflicts will be handled below.
          if git merge --no-commit --no-ff upstream/main; then
            :
          elif [ -z "$(git ls-files -u)" ]; then
            echo '::error::Git merge failed for a reason other than conflicts'
            exit 1
          fi

          # Remove workflow paths from the index, including conflict stages.
          git rm -r -f --cached --ignore-unmatch .github/workflows/ || true

          # Restore the workflows from the original local commit.
          if git ls-tree -r --name-only "$BASE" -- .github/workflows/ | grep -q .; then
            git checkout "$BASE" -- .github/workflows/
          fi

          # Remove untracked workflow files introduced by upstream.
          git clean -fdq -- .github/workflows/

          # Ensure no workflow conflict entries remain.
          while IFS= read -r path; do
            [ -z "$path" ] || git update-index --force-remove -- "$path"
          done < <(
            git ls-files -u -- .github/workflows/ |
              awk '{print $4}' |
              sort -u
          )

          # Stage the resolved merge result.
          git add -A

          # Only remaining conflicts outside workflows determine the result.
          if [ -n "$(git ls-files -u)" ]; then
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
            git commit --no-edit
          else
            echo 'conflict=none' >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          fi

      - name: Push clean main
        if: steps.merge.outputs.conflict == 'false'
        run: git push origin HEAD:main

      - name: Fetch upstream tags
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git fetch --force upstream \
            '+refs/tags/*:refs/tags/*'

      - name: Remove workflows from tag histories
        if: steps.merge.outputs.conflict == 'false'
        run: |
          python3 -m pip install --disable-pip-version-check git-filter-repo

          # Rewrite tag histories only. Do not rewrite main.
          git filter-repo --force \
            --refs refs/tags/* \
            --path .github/workflows/ \
            --invert-paths

      - name: Push sanitized tags
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin 'refs/tags/*:refs/tags/*'

      - name: Prepare conflict PR
        id: prepare-pr
        if: steps.merge.outputs.conflict == 'true'
        run: |
          git fetch origin main
          BASE="$(git rev-parse origin/main)"
          MERGE_RESULT="$(git rev-parse HEAD)"

          # Save all commit messages before changing the branch history.
          git log --reverse --format='--- %h ---%n%B' \
            "$BASE..$MERGE_RESULT" \
            > "$RUNNER_TEMP/sync-commit-messages.txt"

          git log --reverse --format='- %h %s' \
            "$BASE..$MERGE_RESULT" \
            > "$RUNNER_TEMP/sync-commit-list.txt"

          # Prepare the PR body in both cases.
          {
            echo '## Included $(wc -l < "$RUNNER_TEMP/sync-commit-list.txt") commits'
            echo
            cat "$RUNNER_TEMP/sync-commit-list.txt"

            echo
            echo '## Notes'
            echo
            echo 'Workflow files are excluded from the sync changes.'
          } > "$RUNNER_TEMP/sync-pr-body.md"

          # Detect workflow changes anywhere in the commits being pushed,
          # even if later commits reverted those changes.
          WORKFLOW_PATHS="$(
            git log --full-history --format= --name-only \
              "$BASE..$MERGE_RESULT" -- .github/workflows/
          )"

          if [ -z "$WORKFLOW_PATHS" ]; then
            echo '::notice::No workflow paths in commit history; preserving original commits'
            echo 'create_pr=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo '::notice::Workflow paths found in commit history; rebuilding a single-commit PR branch'

          # Preserve the final non-workflow changes as a binary-capable patch.
          git diff --binary "$BASE" "$MERGE_RESULT" \
            -- . ':(exclude).github/workflows/**' \
            > "$RUNNER_TEMP/sync.patch"

          # Reset the local branch to the actual PR base.
          git checkout main
          git reset --hard "$BASE"

          # Apply only non-workflow changes.
          if [ -s "$RUNNER_TEMP/sync.patch" ]; then
            git apply --index "$RUNNER_TEMP/sync.patch"
          fi

          # Do not create an empty PR if all changes were workflows.
          if git diff --cached --quiet; then
            echo '::notice::No non-workflow changes remain; skipping PR'
            echo 'create_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Include every original commit message in the new commit message.
          {
            echo 'chore: sync upstream XTLS/Xray-core (conflict resolution)'
            echo
            echo 'Included original commit messages:'
            echo
            cat "$RUNNER_TEMP/sync-commit-messages.txt"
          } > "$RUNNER_TEMP/sync-single-commit-message.txt"

          git commit -F "$RUNNER_TEMP/sync-single-commit-message.txt"

          # Verify the new commit is directly based on origin/main.
          if [ "$(git rev-parse HEAD^)" != "$BASE" ]; then
            echo '::error::Single commit is not directly based on origin/main'
            exit 1
          fi

          # Verify that the resulting commit does not modify workflow paths.
          if git diff-tree --no-commit-id --name-only -r HEAD \
            | grep -q '^\.github/workflows/'; then
            echo '::error::Workflow changes remain in the new commit'
            exit 1
          fi

          echo 'create_pr=true' >> "$GITHUB_OUTPUT"

      - name: Open conflict PR
        if: steps.prepare-pr.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: sync/upstream
          delete-branch: true
          title: 'chore: sync upstream XTLS/Xray-core (conflict resolution)'
          body-path: ${{ runner.temp }}/sync-pr-body.md
