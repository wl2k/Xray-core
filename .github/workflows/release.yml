name: Build and Release

# `name` is a literal, only `run-name` evaluates expressions.
run-name: Build and Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - v*
  # The sync workflow strips .github/workflows from the tags it mirrors, and
  # GitHub only reads workflow files from the pushed ref, so pushing such a
  # tag can never start this workflow.  The sync dispatches it explicitly
  # instead, passing the tag to build.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true
        type: string

jobs:
  check-assets:
    runs-on: ubuntu-slim
    steps:
      - name: Check the tag exists
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A dispatch can name a tag that was never pushed, and checking out a
          # missing ref only produces three opaque checkout failures.
          if ! git ls-remote --exit-code --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} does not exist in ${GITHUB_REPOSITORY}"
            exit 1
          fi

      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-

      - name: Check Assets Existence
        id: check-assets
        run: |
          [ -d 'resources' ] || mkdir resources
          LIST=('geoip.dat' 'geosite.dat')
          for FILE_NAME in "${LIST[@]}"
          do
            echo -e "Checking ${FILE_NAME}..."
            if [ -s "./resources/${FILE_NAME}" ]; then
              echo -e "${FILE_NAME} exists."
            else
              echo -e "${FILE_NAME} does not exist."
              exit 1
            fi
          done

  build:
    needs: check-assets
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]

    runs-on: ubuntu-slim
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show workflow information
        run: |
          _NAME=${{ matrix.patch-assetname }}
          [ -n "$_NAME" ] || _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Get project dependencies
        run: go mod download

      - name: Build Xray
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty)
          go build -o build_assets/xray -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main

      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-

      - name: Add additional assets into package
        run: |
          mv -f resources/geo* build_assets/

      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-${{ env.ASSET_NAME }}.zip .
          popd || exit 1
          FILE=./Xray-${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ./Xray-${{ env.ASSET_NAME }}.zip*

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Xray-${{ env.ASSET_NAME }}
          path: |
            ./build_assets/*
